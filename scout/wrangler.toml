# The job scout's cron Worker (scout/index.ts). Deploy with `npm run deploy:scout`, which points
# wrangler at this file; a bare `wrangler deploy` from the repo root would read the Pages config.
name = "job-tracker-scout"
main = "index.ts"
compatibility_date = "2025-09-01"

# Every five minutes from 05:00 to 06:55 UTC: 07:00–08:55 in Prague in summer, 06:00–07:55 in
# winter. 24 ticks, enough for 12 searches, 10 agent runs and the digest.
[triggers]
crons = ["*/5 5-6 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "job-tracker-db"
database_id = "4649e3c5-4cec-4e88-9c59-6f79a7092a15"

[ai]
binding = "AI"

[vars]
NOTIFY_EMAIL = "erikkarasek@centrum.cz"

# Secret, set once: npx wrangler secret put RESEND_API_KEY -c scout/wrangler.toml
